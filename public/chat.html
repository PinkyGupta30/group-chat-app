<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Socket.IO Chat</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #222;
            color: white;
            padding: 15px;
        }

        header h2 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
        }

        .personal-chat {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        #userEmailInput {
            padding: 10px;
            width: 60%;
            box-sizing: border-box;
        }

        #joinRoomBtn {
            padding: 10px 15px;
            cursor: pointer;
        }

        #roomStatus {
            margin-bottom: 0;
            color: green;
        }

        #messages {
            background: white;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .message {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #e8e8e8;
        }

        .message-user {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .message-text {
            margin-bottom: 5px;
        }

        .message-time {
            font-size: 12px;
            color: #777;
        }

        #messageForm {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            box-sizing: border-box;
        }

        #messageForm button {
            padding: 12px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h2>Socket.IO Chat</h2>
    </header>

    <div class="container">

        <!-- ============================== -->
        <!-- PERSONAL CHAT -->
        <!-- ============================== -->

        <div class="personal-chat">

            <input
                type="text"
                id="userEmailInput"
                placeholder="Enter user email"
            />

            <button
                type="button"
                id="joinRoomBtn"
            >
                Start Personal Chat
            </button>

            <p id="roomStatus"></p>

        </div>


        <!-- ============================== -->
        <!-- MESSAGES -->
        <!-- ============================== -->

        <div id="messages"></div>


        <!-- ============================== -->
        <!-- SEND MESSAGE -->
        <!-- ============================== -->

        <form id="messageForm">

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message here"
                autocomplete="off"
            />

            <button type="submit">
                Send
            </button>

        </form>

    </div>


    <!-- Socket.IO client -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Your JavaScript -->
    <script src="script.js"></script>

</body>
</html>
