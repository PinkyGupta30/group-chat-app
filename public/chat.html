<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Socket.IO Chat</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #2196d3;
        }

        /* ============================== */
        /* HEADER */
        /* ============================== */

        header {
            background: #000;
            color: white;
            padding: 20px;
        }

        header h2 {
            margin: 0;
        }

        /* ============================== */
        /* MAIN CONTAINER */
        /* ============================== */

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        /* ============================== */
        /* PERSONAL CHAT */
        /* ============================== */

        .personal-chat {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .personal-chat input {
            width: 60%;
            padding: 10px;
        }

        .personal-chat button {
            padding: 10px 15px;
            cursor: pointer;
        }

        #roomStatus {
            color: green;
            margin-bottom: 0;
        }

        /* ============================== */
        /* GROUP CHAT */
        /* ============================== */

        .group-chat {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .group-chat input {
            width: 40%;
            padding: 10px;
        }

        .group-chat button {
            padding: 10px 15px;
            cursor: pointer;
            margin-left: 5px;
        }

        #groupStatus {
            color: green;
            margin-bottom: 0;
        }

        /* ============================== */
        /* MESSAGES */
        /* ============================== */

        #messages {
            background: white;
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .message {
            background: #e5e5e5;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            max-width: 70%;
        }

        .message-user {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .message-text {
            margin-bottom: 5px;
        }

        .message-time {
            font-size: 12px;
            color: #777;
        }

        /* ============================== */
        /* MESSAGE FORM */
        /* ============================== */

        #messageForm {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        #messageForm button {
            padding: 12px 25px;
            cursor: pointer;
        }

    </style>

</head>


<body>


    <!-- ============================== -->
    <!-- HEADER -->
    <!-- ============================== -->

    <header>

        <h2>
            Socket.IO Chat
        </h2>

    </header>


    <div class="container">


        <!-- ============================== -->
        <!-- PERSONAL CHAT -->
        <!-- ============================== -->

        <div class="personal-chat">

            <input
                type="text"
                id="userEmailInput"
                placeholder="Enter user email"
            >

            <button
                type="button"
                id="joinRoomBtn"
            >
                Start Personal Chat
            </button>

            <p id="roomStatus"></p>

        </div>


        <!-- ============================== -->
        <!-- GROUP CHAT -->
        <!-- ============================== -->

        <div class="group-chat">

            <input
                type="text"
                id="groupNameInput"
                placeholder="Enter group name"
            >

            <button
                type="button"
                id="joinGroupBtn"
            >
                Create / Join Group
            </button>

            <button
                type="button"
                id="leaveGroupBtn"
            >
                Leave Group
            </button>

            <p id="groupStatus"></p>

        </div>


        <!-- ============================== -->
        <!-- MESSAGES -->
        <!-- ============================== -->

        <div id="messages"></div>


        <!-- ============================== -->
        <!-- SEND MESSAGE -->
        <!-- ============================== -->

        <form id="messageForm">

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message here"
                autocomplete="off"
            >

            <button type="submit">
                Send
            </button>

        </form>


    </div>


    <!-- ============================== -->
    <!-- SOCKET.IO CLIENT -->
    <!-- ============================== -->

    <script src="/socket.io/socket.io.js"></script>


    <!-- ============================== -->
    <!-- APPLICATION JAVASCRIPT -->
    <!-- ============================== -->

    <script src="script.js"></script>


</body>

</html>
