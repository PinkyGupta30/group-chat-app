<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Group Chat</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #f5f5f5;
        }

        button:hover {
            background: #e8e8e8;
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
        }

        .message {
            background: #f1f1f1;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .message-user {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .message-text {
            margin-bottom: 5px;
        }

        .message-time {
            font-size: 12px;
            color: gray;
        }

        .media-image {
            max-width: 300px;
            max-height: 300px;
            display: block;
            margin-top: 8px;
            border-radius: 8px;
        }

        .media-video {
            max-width: 400px;
            max-height: 300px;
            display: block;
            margin-top: 8px;
        }


        /* ============================== */
        /* AI SUGGESTIONS */
        /* ============================== */

        #aiSuggestions {
            margin-bottom: 10px;
        }

        .ai-title {
            font-size: 13px;
            font-weight: bold;
            color: #666;
            margin-bottom: 5px;
        }

        #typingSuggestions,
        #smartReplies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .ai-button {
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 15px;
            padding: 7px 12px;
            font-size: 13px;
        }

        .ai-button:hover {
            background: #ddd;
        }

        #aiLoading {
            display: none;
            font-size: 13px;
            color: gray;
            margin-top: 5px;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>Group Chat</h1>


    <!-- ============================== -->
    <!-- PERSONAL CHAT -->
    <!-- ============================== -->

    <div class="section">

        <h3>Personal Chat</h3>

        <input
            type="email"
            id="userEmailInput"
            placeholder="Enter user email"
        >

        <button id="joinRoomBtn">
            Start Personal Chat
        </button>

        <p id="roomStatus"></p>

    </div>


    <!-- ============================== -->
    <!-- GROUP CHAT -->
    <!-- ============================== -->

    <div class="section">

        <h3>Group Chat</h3>

        <input
            type="text"
            id="groupNameInput"
            placeholder="Enter group name"
        >

        <button id="joinGroupBtn">
            Create / Join Group
        </button>

        <button id="leaveGroupBtn">
            Leave Group
        </button>

        <p id="groupStatus"></p>

    </div>


    <!-- ============================== -->
    <!-- MESSAGES -->
    <!-- ============================== -->

    <div id="messages"></div>


    <!-- ============================== -->
    <!-- AI SUGGESTIONS -->
    <!-- ============================== -->

    <div id="aiSuggestions">

        <!-- Predictive typing -->

        <div class="ai-title">
            ✨ Suggestions
        </div>

        <div id="typingSuggestions"></div>


        <!-- Smart replies -->

        <div
            class="ai-title"
            style="margin-top: 10px;"
        >
            💬 Smart Replies
        </div>

        <div id="smartReplies"></div>


        <!-- Loading -->

        <div id="aiLoading">
            Generating suggestions...
        </div>

    </div>


    <!-- ============================== -->
    <!-- MESSAGE FORM -->
    <!-- ============================== -->

    <form id="messageForm">

        <input
            type="file"
            id="mediaInput"
        >

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
        >

        <button type="submit">
            Send
        </button>

    </form>


</div>


<!-- Socket.IO -->

<script src="/socket.io/socket.io.js"></script>


<!-- Main JavaScript -->

<script src="script.js"></script>


</body>

</html>
