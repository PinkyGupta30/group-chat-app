<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="container">

        <h2>Login</h2>


        <form id="loginForm">

            <input
                type="text"
                placeholder="Email or Phone Number"
                id="login"
                required
            >


            <input
                type="password"
                placeholder="Password"
                id="password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p>

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </p>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(e) {

                e.preventDefault();


                const login =
                    document
                        .getElementById("login")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value
                        .trim();


                if (!login || !password) {

                    alert(
                        "Please enter email/phone and password"
                    );

                    return;

                }


                // Save logged-in user information
                // for Socket.IO authentication
                localStorage.setItem(
                    "userEmail",
                    login
                );


                alert("Login successful!");


                // Open chat
                window.location.href =
                    "chat.html";

            });

    </script>

</body>

</html>
